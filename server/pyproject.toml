[project]
name = "ctu-omnitrain-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
  # Schema generation
  'pydantic',

  # HTTP API
  'fastapi',
  'uvicorn[standard]',
  'python-multipart',
  'pydantic-settings',

  # Database
  'sqlalchemy[asyncio]',
  'asyncpg',
  'alembic',

  # Auth
  'pyjwt',
  'argon2-cffi',
  # Encrypting stored third-party tokens (the Hugging Face integration)
  'cryptography>=50.0.2',

  # Snapshots / config / ids
  'pyarrow',
  'pyyaml',
  'uuid-utils',

  # Image thumbnails and augmentation
  'pillow',

  # S3-compatible storage
  'boto3',
  's3fs',
  'types-boto3[essential]',

  # Deep learning
  'torch',
  'torchaudio',
  'torchcodec',
  'torchvision',
  'torchmetrics',
  'ludwig',
  # YOLO trainer backend (AGPL-3.0)
  'ultralytics',
  'pandas',
  # ONNX export: torch.onnx.export needs both
  'onnx',
  'onnxscript',

  # scikit-learn trainer backend (BSD-3). skops stores its models without pickle's code execution;
  # skl2onnx converts them to ONNX for export
  'scikit-learn>=1.9.0',
  'skops>=0.16.0',
  'skl2onnx>=1.20.0',

  # Telemetry
  "opentelemetry-sdk>=1.44.0",
  "opentelemetry-exporter-otlp-proto-http>=1.44.0",
  "opentelemetry-instrumentation-fastapi",
  "opentelemetry-instrumentation-sqlalchemy",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.0.0",
  "httpx",
  "ruff",
  "onnxruntime",
  "types-PyYAML",
  "scipy-stubs",
]

[tool.pytest.ini_options]
# Modules are imported as top-level (e.g. `from services.predict import ...`)
# relative to server/ — same as how main.py resolves them at runtime.
pythonpath = ["."]
asyncio_mode = "auto"

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]
torchaudio = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions", "schema", "omnitrain/plugins/export/templates"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"omnitrain/plugins/export/readme.py" = ["E501"] # README prose
