# ─────────────────────────────────────────────────────────────────────
# CTU Theseus - Docker Compose
#
# Usage:
#   Infrastructure only (for local dev):
#     docker compose up db nats rustfs -d
#
#   Full stack:
#     docker compose up -d
#
#   Rebuild a specific service:
#     docker compose up --build gateway -d
# ─────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL ──────────────────────────────────────────────────
  db:
    image: postgres:18-alpine # UUID v7 is supported from PostgreSQL 18
    restart: unless-stopped
    environment:
      POSTGRES_USER: theseus
      POSTGRES_PASSWORD: theseus
      POSTGRES_DB: theseus
    ports:
      - "7196:5432" # Avoid conflict with local PostgreSQL
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U theseus"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── NATS ───────────────────────────────────────────────────────
  nats:
    image: nats:2.11-alpine
    restart: unless-stopped
    ports:
      - "4222:4222"       # Client connections
      - "8222:8222"       # HTTP monitoring
    command: ["--jetstream", "--store_dir", "/data"]
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── RustFS (S3-compatible object storage) ──────────────────────
  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    ports:
      - "9000:9000"       # S3 API
      - "9001:9001"       # Web console
    environment:
      RUSTFS_ROOT_USER: theseus
      RUSTFS_ROOT_PASSWORD: theseus-secret
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - rustfsdata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── AI Worker (NATS consumer, single GPU) ──────────────────────
  ai_worker:
    build:
      context: .
      dockerfile: Dockerfile.ai
    restart: unless-stopped
    environment:
      NATS_URL: nats://nats:4222
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: theseus
      S3_SECRET_KEY: theseus-secret
      PYTHONUNBUFFERED: 1
    volumes:
      - ./ai_service:/app/ai_service
    command: python -m ai_service.main
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    depends_on:
      nats:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── ElysiaJS Gateway ────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://theseus:theseus@db:5432/theseus
      JWT_SECRET: ${JWT_SECRET:-theseus-production-secret}
      NATS_URL: nats://nats:4222
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: theseus
      S3_SECRET_KEY: theseus-secret
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_healthy
      rustfs:
        condition: service_healthy

volumes:
  pgdata:
  natsdata:
  rustfsdata:
