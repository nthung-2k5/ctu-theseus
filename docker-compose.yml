# ─────────────────────────────────────────────────────────────────────
# CTU Theseus - Docker Compose
#
# Usage:
#   Infrastructure only (for local dev):
#     docker compose up db nats -d
#
#   Full stack:
#     docker compose up -d
#
#   Rebuild a specific service:
#     docker compose up --build gateway -d
# ─────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL ──────────────────────────────────────────────────
  db:
    image: postgres:18-alpine # UUID v7 is supported from PostgreSQL 18
    restart: unless-stopped
    environment:
      POSTGRES_USER: theseus
      POSTGRES_PASSWORD: theseus
      POSTGRES_DB: theseus
    ports:
      - "7196:5432" # Avoid conflict with local PostgreSQL
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U theseus"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── NATS (replaces Redis) ──────────────────────────────────────
  nats:
    image: nats:2.11-alpine
    restart: unless-stopped
    ports:
      - "4222:4222"       # Client connections
      - "8222:8222"       # HTTP monitoring
    command: ["--jetstream", "--store_dir", "/data"]
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── AI Worker (NATS consumer, single GPU) ──────────────────────
  ai_worker:
    build:
      context: .
      dockerfile: Dockerfile.ai
    restart: unless-stopped
    environment:
      NATS_URL: nats://nats:4222
      UPLOAD_DIR: /app_data/uploads
      MODEL_DIR: /app_data/models
      DATASET_DIR: /app_data/datasets
      DATA_DIR: /app_data/data
      PYTHONUNBUFFERED: 1
    volumes:
      - ./ai_mount:/app_data
      - ./ai_service:/app/ai_service
    command: python -m ai_service.worker
    depends_on:
      nats:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── ElysiaJS Gateway ────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - ./ai_mount:/app/ai_mount
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://theseus:theseus@db:5432/theseus
      JWT_SECRET: ${JWT_SECRET:-theseus-production-secret}
      NATS_URL: nats://nats:4222
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_healthy

volumes:
  pgdata:
  natsdata:
