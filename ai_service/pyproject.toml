[project]
name = "ctu-theseus-ai"
version = "0.1.0"
description = "Add your description here"
readme = "ai_service/README.md"
requires-python = ">=3.12"
dependencies = [
  # Schema generation
  'pydantic',

  # Health endpoint
  'aiohttp',

  # NATS messaging
  'nats-py',

  # S3-compatible storage
  'boto3',
  's3fs',

  # Deep learning
  'ludwig',
  'pandas',

  # Telemetry
  "opentelemetry-sdk>=1.44.0",
  "opentelemetry-exporter-otlp-proto-http>=1.44.0",
]

[dependency-groups]
dev = [
  "datamodel-code-generator>=0.72.3",
  "pytest>=9.1.1",
  "types-boto3[essential]",
]

[tool.pytest.ini_options]
# Modules are imported as top-level (e.g. `from services.predict import ...`)
# relative to ai_service/ — same as how main.py resolves them at runtime.
pythonpath = ["."]
