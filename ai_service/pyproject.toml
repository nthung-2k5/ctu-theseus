[project]
name = "ctu-theseus-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
  # Schema generation
  'pydantic',

  # Health endpoint
  'aiohttp',

  # NATS messaging
  'nats-py',

  # S3-compatible storage
  'boto3',
  's3fs',
  'types-boto3[essential]',

  # Deep learning
  'torch',
  'torchaudio',
  'torchcodec',
  'torchvision',
  'torchmetrics',
  'ludwig',
  'pandas',

  # Telemetry
  "opentelemetry-sdk>=1.44.0",
  "opentelemetry-exporter-otlp-proto-http>=1.44.0",
]

[dependency-groups]
dev = ["datamodel-code-generator>=0.72.3", "pytest>=9.1.1", "pytest-asyncio>=1.0.0"]

[tool.pytest.ini_options]
# Modules are imported as top-level (e.g. `from services.predict import ...`)
# relative to ai_service/ — same as how main.py resolves them at runtime.
pythonpath = ["."]
asyncio_mode = "auto"

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]
torchaudio = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
